name: CI Checks
on:
  pull_request:
    branches: [ "feat/3d-lego-engine", "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run Lint
        run: npm run lint
      - name: Run Tests
        run: npm test