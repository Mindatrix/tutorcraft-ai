name: CI Gatekeeper

on:
  pull_request:
    branches: ["feat/3d-lego-engine", "main"]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # test:security attacks a running server (default http://localhost:3000).
      # It uses the built-in demo battle, so no database or secrets are needed.
      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && exit 0
            sleep 1
          done
          echo "Server did not start" && cat server.log && exit 1

      - name: Security check
        run: npm run test:security
